<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Match Simulator - Arena Viewer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0d1117;
            --bg-mid: #161b22;
            --bg-card: #1c2333;
            --bg-field: #1a1f2e;
            --border: #30363d;
            --gold: #c8a44e;
            --gold-light: #e8c86e;
            --gold-dark: #8b6914;
            --mana-w: #f9f4e9;
            --mana-u: #0e68ab;
            --mana-b: #150b00;
            --mana-r: #d32029;
            --mana-g: #00733e;
            --life-red: #e74c3c;
            --life-green: #2ecc71;
            --text: #e6e6e6;
            --text-dim: #8b949e;
            --accent: #c8a44e;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* ─── Top Bar ─── */
        .top-bar {
            background: linear-gradient(180deg, #1a1510 0%, #0d1117 100%);
            border-bottom: 1px solid var(--gold-dark);
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            flex-shrink: 0;
        }
        .top-bar .logo {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .phase-indicator {
            display: flex;
            gap: 2px;
            align-items: center;
        }
        .phase-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }
        .phase-dot.active { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
        .phase-label {
            color: var(--gold);
            font-size: 11px;
            margin-left: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .turn-badge {
            background: var(--gold-dark);
            color: var(--gold-light);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* ─── Main Game Area ─── */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at center, #1a2030 0%, #0d1117 70%);
            position: relative;
            overflow: hidden;
        }
        
        /* Field texture overlay */
        .game-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        /* ─── Player Zone ─── */
        .player-zone {
            display: flex;
            align-items: stretch;
            padding: 4px 8px;
            position: relative;
            z-index: 1;
        }
        .player-zone.opponent { flex-direction: row; }
        .player-zone.self { flex-direction: row; }
        
        /* Life + Info Panel */
        .player-info {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .life-circle {
            width: 54px; height: 54px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            position: relative;
            transition: all 0.3s;
        }
        .life-circle.high { background: radial-gradient(circle, #1a3a1a, #0d1117); border-color: var(--life-green); color: var(--life-green); }
        .life-circle.mid { background: radial-gradient(circle, #2a2a1a, #0d1117); border-color: var(--gold); color: var(--gold); }
        .life-circle.low { background: radial-gradient(circle, #3a1a1a, #0d1117); border-color: var(--life-red); color: var(--life-red); }
        .player-name-tag {
            font-size: 9px;
            color: var(--text-dim);
            text-align: center;
            max-width: 76px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .zone-counts {
            display: flex;
            gap: 6px;
            font-size: 9px;
            color: var(--text-dim);
        }
        .zone-count {
            display: flex;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(255,255,255,0.05);
        }
        .zone-count:hover { background: rgba(255,255,255,0.1); }
        .zone-count .icon { font-size: 10px; }
        .active-indicator {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: transparent;
            transition: all 0.3s;
        }
        .active-indicator.active {
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
        }
        
        /* ─── Battlefield ─── */
        .battlefield {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 0;
        }
        .bf-row {
            display: flex;
            gap: 3px;
            flex: 1;
            min-height: 0;
        }
        .bf-row.lands { max-height: 45%; }
        .bf-row.creatures { max-height: 55%; }
        
        /* ─── Card Slots ─── */
        .card-slot {
            width: 62px;
            min-width: 50px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s;
        }
        .card-slot.empty {
            background: rgba(255,255,255,0.02);
        }
        
        /* ─── Card ─── */
        .card-in-play {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .card-in-play:hover {
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(200,164,78,0.4);
            z-index: 10;
        }
        .card-in-play .card-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-in-play .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 2px 3px;
            font-size: 7px;
            line-height: 1.2;
        }
        .card-in-play .card-overlay .co-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .card-in-play .card-overlay .co-stats {
            color: var(--gold-light);
            font-weight: 700;
        }
        .card-in-play.tapped {
            transform: rotate(90deg) scale(0.85);
            opacity: 0.75;
        }
        .card-in-play.tapped:hover {
            transform: rotate(90deg) scale(0.92);
        }
        .card-in-play .summoning-sick::after {
            content: '';
            position: absolute;
            top: 2px; right: 2px;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #e67e22;
        }
        
        /* ─── Hand ─── */
        .hand-zone {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 90px 0 90px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .hand-cards {
            display: flex;
            gap: 2px;
            align-items: center;
            perspective: 600px;
        }
        .hand-card {
            width: 55px;
            height: 78px;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .hand-card:hover {
            transform: translateY(-12px) scale(1.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            z-index: 20;
            border-color: var(--gold);
        }
        .hand-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hand-card-back {
            width: 55px;
            height: 78px;
            border-radius: 4px;
            background: linear-gradient(135deg, #2a1a0a, #1a0a00);
            border: 1px solid #3a2a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hand-card-back .cb-pattern {
            width: 38px;
            height: 58px;
            border-radius: 2px;
            background: linear-gradient(135deg, var(--gold-dark), #2a1a0a);
            border: 1px solid var(--gold-dark);
        }
        
        /* ─── Center Divider ─── */
        .center-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold), var(--gold-dark), transparent);
            margin: 0 80px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .stack-area {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(13,17,23,0.9);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 10px;
            color: var(--gold);
            white-space: nowrap;
        }
        
        /* ─── Bottom Controls ─── */
        .controls-bar {
            background: linear-gradient(0deg, #1a1510 0%, #0d1117 100%);
            border-top: 1px solid var(--gold-dark);
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            flex-shrink: 0;
        }
        .ctrl-btn {
            background: rgba(200,164,78,0.1);
            border: 1px solid var(--gold-dark);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .ctrl-btn:hover { background: rgba(200,164,78,0.25); border-color: var(--gold); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: default; }
        .ctrl-btn.play-btn {
            background: var(--gold-dark);
            color: #fff;
            padding: 4px 20px;
            font-weight: 600;
        }
        .ctrl-btn.play-btn:hover { background: var(--gold); color: #000; }
        .frame-info {
            color: var(--text-dim);
            font-size: 11px;
            min-width: 80px;
            text-align: center;
        }
        .speed-ctrl {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 11px;
        }
        .speed-ctrl input[type=range] {
            width: 60px;
            accent-color: var(--gold);
        }
        
        /* ─── Game Log ─── */
        .game-log {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            max-height: 200px;
            background: rgba(13,17,23,0.92);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            overflow-y: auto;
            font-size: 10px;
            color: var(--text-dim);
            z-index: 50;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dark) transparent;
        }
        .game-log p { margin-bottom: 2px; line-height: 1.3; }
        .game-log::-webkit-scrollbar { width: 4px; }
        .game-log::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 2px; }
        
        /* ─── Card Tooltip ─── */
        .card-tooltip {
            display: none;
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            max-width: 240px;
        }
        .card-tooltip.show { display: block; }
        .card-tooltip img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.7);
        }
        .ct-fallback {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 12px;
        }
        .ct-fallback .ct-name { font-weight: 700; color: var(--gold); font-size: 14px; }
        .ct-fallback .ct-type { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
        .ct-fallback .ct-text { color: var(--text); font-size: 12px; margin-top: 6px; line-height: 1.4; }
        .ct-fallback .ct-stats { color: var(--life-green); font-weight: 700; margin-top: 4px; }
        
        /* ─── Nav Tabs ─── */
        .nav-tabs {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .nav-tab {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .nav-tab:hover { background: rgba(200,164,78,0.15); color: var(--gold); border-color: var(--gold-dark); }
        .nav-tab.active { background: var(--gold-dark); color: #fff; border-color: var(--gold); }
        
        /* ─── Side Panel (Deck Select / Replay List) ─── */
        .side-panel {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 300px;
            background: rgba(13,17,23,0.97);
            border-right: 1px solid var(--gold-dark);
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }
        .side-panel.open { display: flex; }
        .sp-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sp-header h3 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 14px; }
        .sp-close {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 18px;
        }
        .sp-close:hover { color: var(--gold); }
        .sp-content { padding: 12px; flex: 1; overflow-y: auto; }
        
        .sim-form-group { margin-bottom: 12px; }
        .sim-form-group label {
            display: block; font-size: 10px; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
        }
        .sim-form-group select, .sim-form-group input {
            width: 100%; padding: 8px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 4px;
            color: var(--text); font-size: 13px;
        }
        .sim-form-group select:focus, .sim-form-group input:focus {
            outline: none; border-color: var(--gold);
        }
        .sim-go-btn {
            width: 100%; padding: 10px; background: var(--gold-dark);
            border: 1px solid var(--gold); border-radius: 4px;
            color: #fff; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
            font-family: 'Cinzel', serif; letter-spacing: 1px;
        }
        .sim-go-btn:hover { background: var(--gold); color: #000; }
        
        .replay-entry {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .replay-entry:hover { border-color: var(--gold-dark); background: rgba(200,164,78,0.08); }
        .replay-entry .re-title { font-size: 12px; font-weight: 600; color: var(--text); }
        .replay-entry .re-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
        
        /* ─── Responsive ─── */
        @media (max-width: 900px) {
            .card-slot { width: 48px; min-width: 40px; }
            .hand-card, .hand-card-back { width: 44px; height: 62px; }
            .game-log { display: none; }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">MTG ARENA SIMULATOR</div>
        <div class="phase-indicator">
            <div class="phase-dot" id="ph-untap" title="Untap"></div>
            <div class="phase-dot" id="ph-upkeep" title="Upkeep"></div>
            <div class="phase-dot" id="ph-draw" title="Draw"></div>
            <div class="phase-dot" id="ph-main1" title="Main 1"></div>
            <div class="phase-dot" id="ph-combat" title="Combat"></div>
            <div class="phase-dot" id="ph-main2" title="Main 2"></div>
            <div class="phase-dot" id="ph-end" title="End"></div>
            <span class="phase-label" id="phaseLabel">-</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <span class="turn-badge" id="turnBadge">Turno 0</span>
            <div class="nav-tabs">
                <div class="nav-tab" onclick="togglePanel('sim')">Simular</div>
                <div class="nav-tab" onclick="togglePanel('replays')">Replays</div>
            </div>
        </div>
    </div>
    
    <!-- Main Game Area -->
    <div class="game-area" id="gameArea">
        <!-- Side Panel -->
        <div class="side-panel" id="sidePanel">
            <div class="sp-header">
                <h3 id="spTitle">Simular</h3>
                <button class="sp-close" onclick="togglePanel()">&times;</button>
            </div>
            <div class="sp-content" id="spContent"></div>
        </div>
        
        <!-- Opponent Hand -->
        <div class="hand-zone" id="oppHand" style="height:50px;padding:0 90px;"></div>
        
        <!-- Opponent Zone -->
        <div class="player-zone opponent">
            <div class="player-info">
                <div class="active-indicator" id="p2Active"></div>
                <div class="life-circle mid" id="p2Life">20</div>
                <div class="player-name-tag" id="p2Name">Oponente</div>
                <div class="zone-counts">
                    <div class="zone-count" title="Biblioteca"><span class="icon">&#9776;</span><span id="p2Lib">0</span></div>
                    <div class="zone-count" title="Cemiterio"><span class="icon">&#9760;</span><span id="p2Grave">0</span></div>
                </div>
            </div>
            <div class="battlefield" id="p2Battlefield">
                <div class="bf-row creatures" id="p2Creatures"></div>
                <div class="bf-row lands" id="p2Lands"></div>
            </div>
        </div>
        
        <!-- Center Divider -->
        <div class="center-divider">
            <div class="stack-area" id="stackArea">Pilha vazia</div>
        </div>
        
        <!-- Self Zone -->
        <div class="player-zone self">
            <div class="player-info">
                <div class="active-indicator" id="p1Active"></div>
                <div class="life-circle mid" id="p1Life">20</div>
                <div class="player-name-tag" id="p1Name">Jogador</div>
                <div class="zone-counts">
                    <div class="zone-count" title="Biblioteca"><span class="icon">&#9776;</span><span id="p1Lib">0</span></div>
                    <div class="zone-count" title="Cemiterio"><span class="icon">&#9760;</span><span id="p1Grave">0</span></div>
                </div>
            </div>
            <div class="battlefield" id="p1Battlefield">
                <div class="bf-row lands" id="p1Lands"></div>
                <div class="bf-row creatures" id="p1Creatures"></div>
            </div>
        </div>
        
        <!-- Self Hand -->
        <div class="hand-zone" id="selfHand">
            <div class="hand-cards" id="selfHandCards"></div>
        </div>
        
        <!-- Game Log -->
        <div class="game-log" id="gameLog">
            <p style="color:var(--gold);">Bem-vindo ao Arena Viewer!</p>
            <p>Selecione uma partida para comecar.</p>
        </div>
    </div>
    
    <!-- Controls Bar -->
    <div class="controls-bar">
        <button class="ctrl-btn" id="btnFirst" onclick="goFirst()" title="Inicio">&#x23EE;</button>
        <button class="ctrl-btn" id="btnPrev" onclick="goPrev()" title="Anterior">&#x25C0;</button>
        <button class="ctrl-btn play-btn" id="btnPlay" onclick="togglePlay()">&#x25B6; Play</button>
        <button class="ctrl-btn" id="btnNext" onclick="goNext()" title="Proximo">&#x25B6;</button>
        <button class="ctrl-btn" id="btnLast" onclick="goLast()" title="Fim">&#x23ED;</button>
        <div class="frame-info" id="frameInfo">0 / 0</div>
        <div class="speed-ctrl">
            <span>Vel:</span>
            <input type="range" id="speedSlider" min="1" max="10" value="3">
            <span id="speedLabel">3x</span>
        </div>
    </div>
    
    <!-- Card Tooltip -->
    <div class="card-tooltip" id="cardTooltip"></div>

    <script>
        // ─── State ───
        let replays = [];
        let currentReplay = null;
        let currentFrame = 0;
        let isPlaying = false;
        let playInterval = null;
        let speed = 3;
        let cardsData = {};
        let panelOpen = null;
        
        // ─── Init ───
        loadCardsData();
        loadReplayList();
        
        async function loadCardsData() {
            try {
                const r = await fetch('/api/cards');
                cardsData = await r.json();
            } catch(e) { console.warn('Card data unavailable'); }
        }
        
        async function loadReplayList() {
            try {
                const r = await fetch('/api/replays');
                const d = await r.json();
                if (d.replays) replays = d.replays;
            } catch(e) {}
        }
        
        // ─── Panel ───
        function togglePanel(type) {
            const panel = document.getElementById('sidePanel');
            // Se não passou type ou já está aberto com o mesmo type, fecha
            if (!type || panelOpen === type) {
                panel.classList.remove('open');
                panelOpen = null;
                return;
            }
            panelOpen = type;
            panel.classList.add('open');
            
            const title = document.getElementById('spTitle');
            const content = document.getElementById('spContent');
            
            if (type === 'sim') {
                title.textContent = 'Nova Simulacao';
                content.innerHTML = `
                    <div class="sim-form-group">
                        <label>Deck A</label>
                        <select id="deckASelect"></select>
                    </div>
                    <div class="sim-form-group">
                        <label>Deck B</label>
                        <select id="deckBSelect"></select>
                    </div>
                    <div class="sim-form-group">
                        <label>Partidas</label>
                        <input type="number" id="matchCount" value="5" min="1" max="50">
                    </div>
                    <button class="sim-go-btn" onclick="runSimulation()">SIMULAR</button>
                    <div id="simResult" style="margin-top:12px;"></div>
                `;
                loadDeckSelects();
            } else {
                title.textContent = 'Replays Salvos';
                renderReplayList(content);
            }
        }
        
        async function loadDeckSelects() {
            try {
                const r = await fetch('/api/decks');
                const d = await r.json();
                const a = document.getElementById('deckASelect');
                const b = document.getElementById('deckBSelect');
                d.decks.forEach((name, i) => {
                    a.innerHTML += `<option value="${name}">${name}</option>`;
                    b.innerHTML += `<option value="${name}" ${i===1?'selected':''}>${name}</option>`;
                });
            } catch(e) {}
        }
        
        async function runSimulation() {
            const deckA = document.getElementById('deckASelect').value;
            const deckB = document.getElementById('deckBSelect').value;
            const matches = parseInt(document.getElementById('matchCount').value);
            if (deckA === deckB) { alert('Selecione decks diferentes!'); return; }
            
            document.getElementById('simResult').innerHTML = '<p style="color:var(--gold);">Simulando...</p>';
            try {
                const r = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({deck_a:deckA, deck_b:deckB, matches:matches})
                });
                const d = await r.json();
                if (d.success) {
                    const pctA = ((d.deck_a_wins/d.matches)*100).toFixed(0);
                    const pctB = ((d.deck_b_wins/d.matches)*100).toFixed(0);
                    const winner = d.deck_a_wins >= d.deck_b_wins ? d.deck_a : d.deck_b;
                    document.getElementById('simResult').innerHTML = `
                        <div style="text-align:center;padding:8px;background:rgba(200,164,78,0.1);border-radius:6px;border:1px solid var(--gold-dark);">
                            <div style="font-family:'Cinzel',serif;color:var(--gold);font-size:14px;">${winner}</div>
                            <div style="font-size:11px;color:var(--text-dim);margin:4px 0;">vence com ${Math.max(pctA,pctB)}% win rate</div>
                            <div style="display:flex;gap:4px;margin-top:6px;">
                                <div style="flex:${pctA};background:var(--life-green);height:16px;border-radius:3px;display:flex;align-items:center;padding:0 4px;font-size:9px;font-weight:700;">${d.deck_a} ${pctA}%</div>
                                <div style="flex:${pctB};background:var(--life-red);height:16px;border-radius:3px;display:flex;align-items:center;padding:0 4px;font-size:9px;font-weight:700;justify-content:flex-end;">${pctB}% ${d.deck_b}</div>
                            </div>
                            <button onclick="togglePanel('replays')" style="margin-top:10px;padding:6px 16px;background:var(--gold);color:#000;border:none;border-radius:4px;cursor:pointer;font-weight:700;font-size:12px;">Ver Replays (${matches})</button>
                        </div>
                    `;
                    // Recarrega a lista de replays
                    await loadReplayList();
                    console.log('Replays carregados:', replays.length);
                }
            } catch(e) {
                document.getElementById('simResult').innerHTML = '<p style="color:var(--life-red);">Erro na simulacao</p>';
            }
        }
        
        function renderReplayList(container) {
            console.log('Renderizando lista de replays:', replays.length);
            if (!replays.length) {
                container.innerHTML = '<p style="color:var(--text-dim);font-size:12px;">Nenhum replay encontrado. Rode uma simulação primeiro.</p>';
                return;
            }
            container.innerHTML = replays.map((r, i) => `
                <div class="replay-entry" onclick="loadReplay(${i})">
                    <div class="re-title">${r.deck_a} vs ${r.deck_b}</div>
                    <div class="re-meta">#${r.match_number} | ${r.turns} turnos | Winner: ${r.winner}</div>
                </div>
            `).join('');
        }
        
        async function loadReplay(idx) {
            const r = replays[idx];
            if (!r) { console.error('Replay não encontrado no índice', idx); return; }
            try {
                console.log('Carregando replay:', r.filename);
                const resp = await fetch(`/replays/${r.filename}`);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                console.log('Replay carregado:', data.frames?.length, 'frames');
                currentReplay = data;
                currentFrame = 0;
                // Fecha o painel
                document.getElementById('sidePanel').classList.remove('open');
                panelOpen = null;
                // Renderiza o primeiro frame
                renderFrame();
                console.log('Frame renderizado com sucesso');
            } catch(e) { 
                console.error('Erro ao carregar replay:', e);
                alert('Erro ao carregar replay: ' + e.message); 
            }
        }
        
        // ─── Render Frame ───
        function renderFrame() {
            try {
                if (!currentReplay) { console.warn('Nenhum replay carregado'); return; }
                if (!currentReplay.frames || !currentReplay.frames[currentFrame]) { 
                    console.warn('Frame não encontrado:', currentFrame); 
                    return; 
                }
                const frame = currentReplay.frames[currentFrame];
                console.log('Renderizando frame', currentFrame, '- Turno', frame.turn, '- Fase', frame.phase);
            
            // Turn & Phase
            document.getElementById('turnBadge').textContent = `Turno ${frame.turn}`;
            document.getElementById('phaseLabel').textContent = frame.phase || '-';
            updatePhaseDots(frame.phase);
            
            // Frame info
            document.getElementById('frameInfo').textContent = `${currentFrame+1} / ${currentReplay.frames.length}`;
            
            // Players
            renderPlayer(1, frame.player1, frame.active_player === 0, true);
            renderPlayer(2, frame.player2, frame.active_player === 1, false);
            
            // Log
            const log = document.getElementById('gameLog');
            log.innerHTML = (frame.log || []).map(l => `<p>${l}</p>`).join('');
            log.scrollTop = log.scrollHeight;
            
            // Buttons
            document.getElementById('btnFirst').disabled = currentFrame === 0;
            document.getElementById('btnPrev').disabled = currentFrame === 0;
            document.getElementById('btnLast').disabled = currentFrame === (currentReplay.frames.length - 1);
            document.getElementById('btnNext').disabled = currentFrame === (currentReplay.frames.length - 1);
            } catch(e) {
                console.error('Erro ao renderizar frame:', e);
            }
        }
        
        function renderPlayer(num, data, isActive, isSelf) {
            const prefix = `p${num}`;
            
            // Life
            const lifeEl = document.getElementById(`${prefix}Life`);
            lifeEl.textContent = data.life;
            lifeEl.className = 'life-circle ' + (data.life >= 15 ? 'high' : data.life >= 8 ? 'mid' : 'low');
            
            // Name
            document.getElementById(`${prefix}Name`).textContent = data.name;
            
            // Active
            document.getElementById(`${prefix}Active`).className = 'active-indicator' + (isActive ? ' active' : '');
            
            // Library & Graveyard
            document.getElementById(`${prefix}Lib`).textContent = data.library_count;
            document.getElementById(`${prefix}Grave`).textContent = data.graveyard_count;
            
            // Battlefield
            const creatures = (data.battlefield || []).filter(c => c.type === 'CREATURE');
            const lands = (data.battlefield || []).filter(c => c.is_land);
            const other = (data.battlefield || []).filter(c => !c.is_land && c.type !== 'CREATURE');
            
            renderBfRow(`${prefix}Creatures`, creatures, 8);
            renderBfRow(`${prefix}Lands`, lands.concat(other), 8);
            
            // Hand
            if (isSelf) {
                renderSelfHand(data, isActive);
            } else {
                renderOppHand(data);
            }
        }
        
        function renderBfRow(elementId, cards, maxSlots) {
            const el = document.getElementById(elementId);
            let html = '';
            for (let i = 0; i < Math.max(cards.length, maxSlots); i++) {
                if (i < cards.length) {
                    const c = cards[i];
                    const tappedClass = c.tapped ? ' tapped' : '';
                    const imgFile = getCardImage(c.name);
                    let statsHtml = '';
                    if (c.power !== null && c.toughness !== null) {
                        statsHtml = `<span class="co-stats">${c.power}/${c.toughness}</span>`;
                    }
                    html += `<div class="card-slot">
                        <div class="card-in-play${tappedClass}" data-card-name="${c.name}" 
                             onmouseenter="showTooltip(event,'${c.name.replace(/'/g,"\\'")}')" 
                             onmouseleave="hideTooltip()" onmousemove="moveTooltip(event)">
                            ${imgFile ? `<img class="card-art" src="${imgFile}" alt="${c.name}" onerror="this.style.display='none'">` : ''}
                            <div class="card-overlay">
                                <div class="co-name">${c.name}</div>
                                ${statsHtml}
                            </div>
                        </div>
                    </div>`;
                } else {
                    html += `<div class="card-slot empty"></div>`;
                }
            }
            el.innerHTML = html;
        }
        
        function renderSelfHand(data, isActive) {
            const el = document.getElementById('selfHandCards');
            if (isActive && data.hand_cards && data.hand_cards.length > 0) {
                el.innerHTML = data.hand_cards.map(c => {
                    const imgFile = getCardImage(c.name);
                    return `<div class="hand-card" data-card-name="${c.name}"
                                onmouseenter="showTooltip(event,'${c.name.replace(/'/g,"\\'")}')"
                                onmouseleave="hideTooltip()" onmousemove="moveTooltip(event)">
                        ${imgFile ? `<img src="${imgFile}" alt="${c.name}" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:7px;text-align:center;padding:2px;\\'>${c.name}</div>'">` : 
                        `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:7px;text-align:center;padding:2px;background:var(--bg-card);">${c.name}</div>`}
                    </div>`;
                }).join('');
            } else {
                el.innerHTML = '';
                for (let i = 0; i < (data.hand_count || 0); i++) {
                    el.innerHTML += `<div class="hand-card-back"><div class="cb-pattern"></div></div>`;
                }
            }
        }
        
        function renderOppHand(data) {
            const el = document.getElementById('oppHand');
            let html = '<div class="hand-cards">';
            for (let i = 0; i < (data.hand_count || 0); i++) {
                html += `<div class="hand-card-back" style="width:35px;height:48px;"><div class="cb-pattern" style="width:24px;height:36px;"></div></div>`;
            }
            html += '</div>';
            el.innerHTML = html;
        }
        
        function getCardImage(cardName) {
            for (const [id, data] of Object.entries(cardsData)) {
                if (data.name && data.name.toLowerCase() === cardName.toLowerCase()) {
                    if (data.local_images && data.local_images.art_crop) {
                        return `/card-images/${data.local_images.art_crop}`;
                    }
                }
            }
            return null;
        }
        
        // ─── Phase Dots ───
        function updatePhaseDots(phase) {
            const phases = ['untap','upkeep','draw','main1','combat','main2','end'];
            const phaseMap = {
                'untap': 'ph-untap', 'upkeep': 'ph-upkeep', 'draw': 'ph-draw',
                'pre_combat_main': 'ph-main1', 'main1': 'ph-main1',
                'combat': 'ph-combat', 'declare_attackers': 'ph-combat', 'declare_blockers': 'ph-combat',
                'combat_damage': 'ph-combat', 'first_strike_damage': 'ph-combat',
                'post_combat_main': 'ph-main2', 'main2': 'ph-main2',
                'end': 'ph-end', 'cleanup': 'ph-end'
            };
            const activeId = phaseMap[phase] || 'ph-main1';
            phases.forEach(p => {
                const dot = document.getElementById(`ph-${p}`);
                if (dot) dot.classList.toggle('active', `ph-${p}` === activeId);
            });
        }
        
        // ─── Tooltip ───
        function showTooltip(e, cardName) {
            const tip = document.getElementById('cardTooltip');
            let found = null;
            for (const [id, data] of Object.entries(cardsData)) {
                if (data.name && data.name.toLowerCase() === cardName.toLowerCase()) { found = data; break; }
            }
            if (!found) {
                for (const [id, data] of Object.entries(cardsData)) {
                    if (data.name && data.name.toLowerCase().includes(cardName.toLowerCase())) { found = data; break; }
                }
            }
            
            if (found) {
                const img = found.local_images ? found.local_images.normal : null;
                if (img) {
                    tip.innerHTML = `<img src="/card-images/${img}" alt="${found.name}" onerror="this.parentElement.innerHTML='<div class=\\'ct-fallback\\'><div class=\\'ct-name\\'>${found.name}</div><div class=\\'ct-type\\'>${found.type_line||''}</div><div class=\\'ct-text\\'>${found.oracle_text||''}</div></div>'">`;
                } else {
                    tip.innerHTML = `<div class="ct-fallback"><div class="ct-name">${found.name}</div><div class="ct-type">${found.type_line||''}</div><div class="ct-text">${found.oracle_text||''}</div>${found.power?`<div class="ct-stats">${found.power}/${found.toughness}</div>`:''}</div>`;
                }
            } else {
                tip.innerHTML = `<div class="ct-fallback"><div class="ct-name">${cardName}</div></div>`;
            }
            tip.classList.add('show');
            moveTooltip(e);
        }
        
        function hideTooltip() {
            document.getElementById('cardTooltip').classList.remove('show');
        }
        
        function moveTooltip(e) {
            const tip = document.getElementById('cardTooltip');
            let x = e.clientX + 15;
            let y = e.clientY - 100;
            if (x + 240 > window.innerWidth) x = e.clientX - 255;
            if (y < 10) y = 10;
            tip.style.left = x + 'px';
            tip.style.top = y + 'px';
        }
        
        // ─── Controls ───
        function goFirst() { currentFrame = 0; renderFrame(); }
        function goPrev() { if (currentFrame > 0) { currentFrame--; renderFrame(); } }
        function goNext() { if (currentReplay && currentFrame < currentReplay.frames.length - 1) { currentFrame++; renderFrame(); } }
        function goLast() { if (currentReplay) { currentFrame = currentReplay.frames.length - 1; renderFrame(); } }
        
        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('btnPlay').innerHTML = isPlaying ? '&#x23F8; Pause' : '&#x25B6; Play';
            if (isPlaying) {
                playInterval = setInterval(() => {
                    if (currentReplay && currentFrame < currentReplay.frames.length - 1) {
                        currentFrame++;
                        renderFrame();
                    } else { togglePlay(); }
                }, 1000 / speed);
            } else { clearInterval(playInterval); }
        }
        
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            document.getElementById('speedLabel').textContent = speed + 'x';
            if (isPlaying) { clearInterval(playInterval); togglePlay(); togglePlay(); }
        });
        
        document.addEventListener('keydown', (e) => {
            if (!currentReplay) return;
            switch(e.key) {
                case 'ArrowLeft': goPrev(); break;
                case 'ArrowRight': goNext(); break;
                case ' ': e.preventDefault(); togglePlay(); break;
                case 'Home': goFirst(); break;
                case 'End': goLast(); break;
            }
        });
    </script>
</body>
</html>
